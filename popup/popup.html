<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toast" id="toast">Copied!</div>

    <div class="header">
      <div class="header-icon">🔐</div>
      <h3>E2E Bridge</h3>
      <button id="toggle-manual">Manual</button>
    </div>
    <div id="manual-tab" style="display: none">
      <!-- Get Public Key Section -->
      <div class="section">
        <span class="section-label">Your Public Key</span>
        <button class="btn-outline" id="show-key" style="width: 100%">
          🔑 Show my public key ID
        </button>
        <!-- publickey outpu -->
        <div class="output-row" style="margin-top: 8px; display: none">
          <div class="output-box empty" id="pub-key-out" title="Click to copy">
            Key ID will appear here
          </div>
        </div>
        <!-- fingerPring outpu -->
        <div class="output-row" style="margin-top: 4px; display: none">
          <div class="output-box empty" id="finger-out" title="Click to copy">
            Fingerprint will appear here
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Encrypt Section -->
      <div class="section">
        <span class="section-label">🔒 Encrypt</span>
        <input type="text" id="message" placeholder="Message to encrypt..." />
        <input
          type="text"
          id="publickey"
          placeholder="Recipient's public key..."
        />
        <button class="btn-primary" id="Encrypt-key" style="width: 100%">
          Encrypt Message
        </button>
        <div class="output-row">
          <div class="output-box empty" id="encryption" title="Click to copy">
            Encrypted output will appear here
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Decrypt Section -->
      <div class="section">
        <span class="section-label">🔓 Decrypt</span>
        <input
          type="text"
          id="encrypted-message"
          placeholder="Encrypted message..."
        />
        <button class="btn-primary" id="Decrypt-key" style="width: 100%">
          Decrypt Message
        </button>
        <div class="output-row">
          <div class="output-box empty" id="decryption" title="Click to copy">
            Decrypted output will appear here
          </div>
        </div>
      </div>
    </div>
    <div id="auto-tab">
      <div class="status-card">
        <span class="section-label">Active Chat ID</span>
        <div id="auto-tab-section" class="chat-id-display">Detecting...</div>
      </div>
      <!-- contacts card -->
      <div class="contacts-card">
        <div class="card-header">
          <span class="section-label">Saved Contacts</span>
          <button id="refresh-contacts-btn" class="refresh-btn">
            ⟳ Refresh
          </button>
        </div>
        <div id="contacts-list" class="contacts-list">
          <div class="placeholder">No contacts yet. Secure a chat to add.</div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
    <script src="UI.js"></script>
    <script src="coppying.js"></script>
  </body>
</html>
